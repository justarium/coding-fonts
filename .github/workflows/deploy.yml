name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # paths:
    #   - 'src/**'
    #   - package.json
  # pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      # - uses: actions/setup-node@v7
      #   with:
      #     node-version: 24
      # - uses: pnpm/action-setup@v4
      #   name: Install pnpm
      #   # with:
      #   #   # version: 10
      #   #   cache: true
      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@24
          cache: true

      # - name: Cache Eleventy .cache
      #   uses: actions/cache@v5
      #   with:
      #     path: ./.cache
      #     key: ${{ runner.os }}-eleventy-fetch-cache

      - name: Install dependencies
        run: pnpm install
      - name: Build Site
        run: pnpm run build --pathprefix ${{ github.event.repository.name }}

      - name: Setup pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy to GitHub pages
        id: deployment
        uses: actions/deploy-pages@v4
